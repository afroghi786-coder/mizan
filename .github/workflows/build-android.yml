name: Build APK with Vosk (Offline Voice)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Cache Vosk models
        id: cache-vosk
        uses: actions/cache@v4
        with:
          path: assets/models-cache
          key: vosk-models-fa-en-v1
      
      - name: Download Vosk models (if not cached)
        if: steps.cache-vosk.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets/models-cache
          cd assets/models-cache
          
          echo "📦 دانلود مدل فارسی..."
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-fa-0.42.zip
          unzip -q vosk-model-small-fa-0.42.zip
          rm vosk-model-small-fa-0.42.zip
          mv vosk-model-small-fa-0.42 model-fa-fa
          
          echo "📦 دانلود مدل انگلیسی..."
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk-model-small-en-us-0.15.zip
          rm vosk-model-small-en-us-0.15.zip
          mv vosk-model-small-en-us-0.15 model-en-us
          
          echo "✅ مدل‌ها آماده شدند"
          ls -la
      
      - name: Prepare assets folder
        run: |
          mkdir -p assets
          cp -r assets/models-cache/model-fa-fa assets/ 2>/dev/null || true
          cp -r assets/models-cache/model-en-us assets/ 2>/dev/null || true
      
      - name: Expo Prebuild
        run: npx expo prebuild --platform android --no-install
      
      - name: Copy models to android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r assets/models-cache/model-fa-fa android/app/src/main/assets/
          cp -r assets/models-cache/model-en-us android/app/src/main/assets/
          echo "📁 محتوای assets:"
          ls -la android/app/src/main/assets/
      
      - name: Fix Gradle mirror (faster download)
        run: |
          sed -i 's|https\\://services.gradle.org/distributions|https\\://mirrors.cloud.tencent.com/gradle|g' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
      
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mizan-apk-vosk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
