name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Download Whisper model (tiny)
        run: |
          mkdir -p assets
          wget -q https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -O assets/ggml-tiny.bin
          ls -la assets/ggml-tiny.bin

      - name: Download Vosk model (Persian) and create uuid
        run: |
          mkdir -p assets/models-cache
          cd assets/models-cache
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-fa-0.42.zip
          unzip -q vosk-model-small-fa-0.42.zip
          rm vosk-model-small-fa-0.42.zip
          mv vosk-model-small-fa-0.42 model-fa-fa
          echo "mizan-fa-model-v1" > model-fa-fa/uuid
          ls -la model-fa-fa/

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Copy models to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r assets/models-cache/model-fa-fa android/app/src/main/assets/
          ls -la android/app/src/main/assets/model-fa-fa/

      - name: Fix Gradle mirror
        run: |
          sed -i 's|https\://services.gradle.org/distributions|https\://mirrors.cloud.tencent.com/gradle|g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mizan-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
